# Machine-readable companion to AGENTS.md: component graph, commands, secrets, policies.
# Never put secret values here - only file paths and environment KEY NAMES.
# Quote every date/version ('2026-01-31', '1.10') so YAML does not convert its type.
# After editing, run: scripts/check-agents-yaml.sh
schema_version: '1.0'

meta:
  name: doksam-skills
  description: 'Agent Skill 모음. skills/<skill>/ 하나가 배포 단위이고 install.sh 가 세 런타임에 심링크로 노출한다'
  owner: dok123
  license: 'MIT (LICENSE, dok123)'
  updated: '2026-10-04'
  repo_url: 'https://github.com/LeeYudok/doksam-skills'
  tracker: github
  issue_tracker_url: 'https://github.com/LeeYudok/doksam-skills/issues'
  issue_rule: 'Open an issue first; reference #N in branch, commits and PR (Closes #N)'
  branch_strategy:
    main: 'protected; required status check = test workflow'
    work: 'batch/claude-<YYYYMMDD>-<8자리 hex, openssl rand -hex 4> -> PR -> merge commit (no squash)'

environments:
  local:
    toolchain: {python: 'python3 stdlib only (Homebrew Python 3.14 breaks third-party imports)', shell: bash}
  ci:
    runner: 'GitHub Actions ubuntu-latest'

nodes:
# repository tooling
- id: installer
  type: bash-script
  label: 'Symlinks every skill (and optionally Agent Adapters) into the three runtimes; --verify queries them'
  path: install.sh
- id: new-skill
  type: bash-script
  label: 'Scaffolds a skill with adapters and root symlinks'
  path: scripts/new_skill.sh
- id: score-skills
  type: python-script
  label: 'Scores every skill (7 criteria, 100 points; verification from tests/claims.json) and regenerates the README maturity table; --check guards drift'
  path: scripts/score_skills.py
- id: run-tests
  type: bash-script
  label: 'Runs tests/ + every skills/*/tests/ + install.sh test'
  path: scripts/run_tests.sh
- id: repo-tests
  type: python-unittest
  label: 'Repo-wide contracts: layout, trigger boundaries, referenced paths, notices, gitignore, new_skill'
  path: tests
- id: agents-yaml-check
  type: bash-script
  label: 'AGENTS.yaml validator (copied unchanged from skills/yd-agents-yaml; needs PyYAML)'
  path: scripts/check-agents-yaml.sh
- id: ci-test
  type: github-workflow
  label: 'Runs scripts/run_tests.sh on PR and main push'
  path: .github/workflows/test.yml
- id: ci-agents-yaml
  type: github-workflow
  label: 'Installs PyYAML, validates AGENTS.yaml and runs validator regression tests (no skips)'
  path: .github/workflows/agents-yaml.yml
- id: ci-layout
  type: github-workflow
  label: 'Chrome headless layout regression for yd-mobile-web-planner only'
  path: .github/workflows/layout.yml
- id: ci-pg
  type: github-workflow
  label: 'postgres:17 service; reproduces yd-pg-expert claims (no skips)'
  path: .github/workflows/pg.yml
- id: ci-oracle
  type: github-workflow
  label: 'gvenzl/oracle-free 23 container; reproduces yd-oracle-expert claims (no skips)'
  path: .github/workflows/oracle.yml
- id: ci-go-claims
  type: github-workflow
  label: 'setup-go; reproduces yd-go-expert claims (no skips)'
  path: .github/workflows/go-claims.yml
- id: ci-react-claims
  type: github-workflow
  label: 'node + pinned react/jsdom/eslint; reproduces yd-react-expert claims (no skips)'
  path: .github/workflows/react-claims.yml
- id: adapter-links
  type: symlink-dir
  label: 'Root symlinks to skills/<skill>/agents/{claude.md,codex.toml}'
  files: [.claude/agents, .codex/agents]
- id: codex-project-skills
  type: config
  label: 'Codex project skill entry pointing at skills/'
  path: .agents/skills.json

# skills (deployment units)
- {id: skill-yd-mobile-web-planner, type: skill, label: 'IA + HTML storyboard generator', path: skills/yd-mobile-web-planner, adapters: true}
- {id: skill-yd-nextjs-implementer, type: skill, label: 'Implements storyboards as Next.js or Vite + React', path: skills/yd-nextjs-implementer, adapters: true}
- {id: skill-yd-sdlc-orchestrator, type: skill, label: 'Meta skill: plan -> implement -> security -> local run', path: skills/yd-sdlc-orchestrator, adapters: true}
- {id: skill-yd-finguard, type: skill, label: 'FinGuard scan as local security gate', path: skills/yd-finguard, adapters: true}
- {id: skill-yd-doksam-ui, type: skill, label: 'ui.doksam.com standard consumer/producer', path: skills/yd-doksam-ui, adapters: true}
- {id: skill-yd-frontend-build, type: skill, label: 'pnpm + Vite build layer', path: skills/yd-frontend-build, adapters: true}
- {id: skill-yd-react-expert, type: skill, label: 'React components/state/a11y', path: skills/yd-react-expert, adapters: true}
- {id: skill-yd-go-expert, type: skill, label: 'Go idioms/net/http/go:embed', path: skills/yd-go-expert, adapters: true}
- {id: skill-yd-sqlite-expert, type: skill, label: 'SQLite engine-specific issues', path: skills/yd-sqlite-expert, adapters: true}
- {id: skill-yd-db-expert, type: skill, label: 'Engine-agnostic relational design', path: skills/yd-db-expert, adapters: true}
- {id: skill-yd-pg-expert, type: skill, label: 'PostgreSQL engine-specific behaviour + pig shared cluster ops', path: skills/yd-pg-expert, adapters: true}
- {id: skill-yd-oracle-expert, type: skill, label: 'Oracle engine-specific issues', path: skills/yd-oracle-expert, adapters: true}
- {id: skill-yd-memory-factcheck, type: skill, label: 'Audits agent memory against evidence', path: skills/yd-memory-factcheck, adapters: true}
- {id: skill-yd-skill-evolve, type: skill, label: 'Feedback-driven SKILL.md improvement', path: skills/yd-skill-evolve, adapters: true}
- {id: skill-yd-writer-kr, type: skill, label: 'Korean writing/editing (doksam style, short logical sentences)', path: skills/yd-writer-kr, adapters: true}
- {id: skill-yd-session-recording, type: skill, label: 'Long-running whisper/ffmpeg session recording', path: skills/yd-session-recording, adapters: false}
- {id: skill-yd-agents-mem, type: skill, label: 'Backs up agent memory/global instructions/config to the agents-mem repo', path: skills/yd-agents-mem, adapters: false}
- {id: skill-yd-handoff, type: skill, label: 'Session handoff (tracker issue + HANDOFF.md pointer)', path: skills/yd-handoff, adapters: false}
- {id: skill-yd-git-ship, type: skill, label: 'Ship agent work to doksam GitLab (issue, batch branch, commit title, MR, CI)', path: skills/yd-git-ship, adapters: false}
- {id: skill-yd-agents-yaml, type: skill, label: 'AGENTS.md + AGENTS.yaml + validator setup (source of scripts/check-agents-yaml.sh)', path: skills/yd-agents-yaml, adapters: false}

# external
- {id: rt-claude-code, type: runtime, label: 'Claude Code (~/.claude/skills, ~/.claude/agents)'}
- {id: rt-codex, type: runtime, label: 'Codex (~/.agents/skills, ~/.codex/agents)'}
- {id: rt-antigravity, type: runtime, label: 'Antigravity (~/.gemini/config/skills, project .agents/skills, agy plugin agents; docs CLI path antigravity-cli/skills is NOT read by agy 1.2.16)'}
- {id: chrome, type: external-binary, label: 'Chrome/Chromium headless (export + layout check)'}
- {id: finguard-cli, type: external-binary, label: 'FinGuard CLI (scan --format rdjsonl)'}
- {id: agents-mem-repo, type: external-repo, label: 'GitLab dok123/agents-mem (per-host mirror of agent assets)'}
- {id: upstage, type: external-api, label: 'Upstage Solar chat completions (api.upstage.ai/v1, solar-pro4)'}
- {id: ui-doksam, type: external-site, label: 'ui.doksam.com (/llms.txt, /rules.md, live fetch)'}

edges:
- {from: installer, to: rt-claude-code, rel: installs}
- {from: installer, to: rt-codex, rel: installs}
- {from: installer, to: rt-antigravity, rel: installs}
- {from: new-skill, to: adapter-links, rel: creates}
- {from: run-tests, to: repo-tests, rel: runs, env: [PYTHON]}
- {from: run-tests, to: installer, rel: tests}
- {from: ci-test, to: run-tests, rel: runs}
- {from: ci-agents-yaml, to: agents-yaml-check, rel: runs}
- {from: ci-agents-yaml, to: skill-yd-agents-yaml, rel: tests}
- {from: ci-layout, to: skill-yd-mobile-web-planner, rel: tests}
- {from: ci-layout, to: chrome, rel: uses, env: [CHROME]}
- {from: skill-yd-mobile-web-planner, to: chrome, rel: uses, env: [CHROME]}
- {from: skill-yd-sdlc-orchestrator, to: skill-yd-mobile-web-planner, rel: delegates}
- {from: skill-yd-sdlc-orchestrator, to: skill-yd-nextjs-implementer, rel: delegates}
- {from: skill-yd-sdlc-orchestrator, to: skill-yd-finguard, rel: delegates}
- {from: skill-yd-nextjs-implementer, to: skill-yd-mobile-web-planner, rel: consumes_output}
- {from: skill-yd-nextjs-implementer, to: skill-yd-frontend-build, rel: references}
- {from: skill-yd-nextjs-implementer, to: skill-yd-react-expert, rel: references}
- {from: skill-yd-nextjs-implementer, to: skill-yd-doksam-ui, rel: references}
- {from: skill-yd-nextjs-implementer, to: skill-yd-db-expert, rel: hands_off_data_contract}
- {from: skill-yd-finguard, to: finguard-cli, rel: runs}
- {from: skill-yd-doksam-ui, to: ui-doksam, rel: fetches}
- {from: skill-yd-pg-expert, to: skill-yd-db-expert, rel: references}
- {from: skill-yd-oracle-expert, to: skill-yd-db-expert, rel: references}
- {from: ci-pg, to: skill-yd-pg-expert, rel: tests, env: [YD_PG_PSQL]}
- {from: ci-oracle, to: skill-yd-oracle-expert, rel: tests, env: [YD_ORACLE_SQLPLUS]}
- {from: ci-go-claims, to: skill-yd-go-expert, rel: tests}
- {from: ci-react-claims, to: skill-yd-react-expert, rel: tests, env: [YD_REACT_VERIFY]}
- {from: agents-yaml-check, to: skill-yd-agents-yaml, rel: copied_from}
- {from: skill-yd-agents-mem, to: agents-mem-repo, rel: runs_scripts_in}
- {from: skill-yd-writer-kr, to: upstage, rel: proofreads_via, env: [UPSTAGE_API_KEY]}

commands:
  local:
    test_all: ./scripts/run_tests.sh
    test_repo: 'python3 -m unittest discover -s tests -t tests -v'
    test_skill: 'python3 -m unittest discover -s skills/<skill>/tests -t skills/<skill>/tests -v'
    test_installer: ./tests/test_install.sh
    install: ./install.sh
    install_verify: './install.sh --verify --with-agent'
    install_list: './install.sh --list'
    score_skills: 'python3 scripts/score_skills.py --write'
    new_skill: './scripts/new_skill.sh <name> "<description>"'
  storyboard_checks:
    validate: 'python3 skills/yd-mobile-web-planner/scripts/validate_storyboard.py <file.html>'
    badge_overflow: 'python3 skills/yd-mobile-web-planner/scripts/check_badge_overflow.py <file.html>'
    badge_alignment: 'python3 skills/yd-mobile-web-planner/scripts/check_badge_alignment.py <file.html>'
    layout_runtime: 'python3 skills/yd-mobile-web-planner/scripts/check_layout_runtime.py <file.html>'
    export: 'python3 skills/yd-mobile-web-planner/scripts/export_deck.py <file.html>'
  checks:
    agents_yaml: scripts/check-agents-yaml.sh
    agents_yaml_tests: 'python3 -m unittest discover -s skills/yd-agents-yaml/tests -t skills/yd-agents-yaml/tests -v'
    sqlite_claims: 'python3 skills/yd-sqlite-expert/scripts/verify_sqlite_claims.py'
    db_claims: 'python3 skills/yd-db-expert/scripts/verify_db_claims.py'
    pg_claims: 'YD_PG_PSQL="podman exec -i ydpg-verify psql -U postgres -v ON_ERROR_STOP=1 -At" python3 skills/yd-pg-expert/scripts/verify_pg_claims.py'
    oracle_claims: 'YD_ORACLE_SQLPLUS="podman exec -i ydora-verify sqlplus -S -L system/verify@//localhost/FREEPDB1" python3 skills/yd-oracle-expert/scripts/verify_oracle_claims.py'
    go_claims: 'python3 skills/yd-go-expert/scripts/verify_go_claims.py'
    react_claims: 'python3 skills/yd-react-expert/scripts/verify_react_claims.py'

secret_files:
- {host: local, path: '~/workspace/.env.toml', keys: [UPSTAGE_API_KEY], used_by: 'yd-writer-kr upstage_proofread.py (fallback when env var is unset)'}
- {host: local, path: '~/workspace/.env.toml', keys: [gitlab_claude_ai.token, gitlab_codex_ai.token, gitlab_agy_ai.token], used_by: 'yd-git-ship glab-as.sh, ci_wait.py --agent (agent GitLab accounts)'}

env_keys:
  run-tests: [PYTHON]
  installer: [TMPDIR]
  skill-yd-mobile-web-planner: [CHROME]
  skill-yd-writer-kr: [UPSTAGE_API_KEY]
  skill-yd-pg-expert: [YD_PG_PSQL]
  skill-yd-oracle-expert: [YD_ORACLE_SQLPLUS]
  skill-yd-react-expert: [YD_REACT_VERIFY]
  skill-yd-git-ship: [GITLAB_HOST, YD_ENV_TOML, YD_TOML_FALLBACK]

policies:
- {id: agents-yaml-sync, rule: 'Update AGENTS.md and AGENTS.yaml together when components, paths, commands or env keys change; run scripts/check-agents-yaml.sh', source: AGENTS.md}
- {id: skill-owns-assets, rule: 'A skill owns SKILL.md, resources, scripts, tests and adapters under skills/<skill>/; nothing skill-specific at repo root', source: AGENTS.md}
- {id: adapters-as-set, rule: 'agents/ holds claude.md, codex.toml, antigravity.md, openai.yaml together or not at all; root adapter files are symlinks', source: AGENTS.md}
- {id: no-hardcoded-skill-names, rule: 'install.sh and root tests iterate skills/; hardcoding a skill name fails tests', source: AGENTS.md}
- {id: stdlib-only, rule: 'Python tests and scripts use stdlib only; the AGENTS.yaml validator needs PyYAML and runs in its own CI job (agents-yaml.yml)', source: AGENTS.md}
- {id: korean-first, rule: 'SKILL.md body, descriptions, adapters, docs, commits/issues/PR bodies in Korean; identifiers stay English', source: AGENTS.md}
- {id: no-emoji-icons, rule: 'No emoji as icons in skills/** or generated HTML; inline Phosphor svg paths', source: AGENTS.md}
- {id: third-party-notices, rule: 'Imported external assets go to THIRD-PARTY-NOTICES.md with verified license; never append to LICENSE', source: AGENTS.md}
- {id: storyboard-class-contract, rule: 'Storyboard HTML may only use classes defined in template.html (plus mermaid)', source: AGENTS.md, files: [skills/yd-mobile-web-planner/resources/template.html]}
- {id: trigger-boundaries, rule: 'Skill descriptions must not overlap unless one names the other and states what it does not cover', source: AGENTS.md, files: [tests/test_trigger_boundaries.py]}
- {id: no-generated-artifacts, rule: 'Generated storyboard HTML is never committed', source: AGENTS.md}

known_issues:
- {id: agy-ignores-adapter-without-frontmatter, summary: 'agy silently ignores agent md without name/description frontmatter; verify with agy agents, not file presence (agy 1.1.11, 2026-08-11)', source: AGENTS.md}
- {id: rel-url-from-namespace, summary: 'Deriving pptx relationship-type URLs from the package namespace yields well-formed but unopenable files', source: AGENTS.md, files: [skills/yd-mobile-web-planner/scripts/export_deck.py, skills/yd-mobile-web-planner/tests/test_export_deck.py]}
- {id: mock-footer-position, summary: '.mock-footer without position: relative anchored footer badges to .mock; caught only by runtime layout check', source: AGENTS.md, files: [skills/yd-mobile-web-planner/scripts/check_layout_runtime.py]}
- {id: bundle-url-noise, summary: 'Frameworks embed doc URLs in bundles; only request-causing contexts count as external fetches', source: AGENTS.md, files: [skills/yd-frontend-build/scripts/check_bundle.py]}
- {id: ghost-gate, summary: 'A doc referencing a missing or "planned" gate makes agents skip it silently; enforced by referenced-paths test', source: AGENTS.md, files: [tests/test_referenced_paths.py]}
- {id: stale-global-symlinks, summary: 'Repo moved under github.com/LeeYudok/; global skill symlinks made before the move dangle until ./install.sh --force is rerun (2026-10-04)', source: install.sh}

docs:
- {path: AGENTS.md, what: 'Agent instructions (human SoT)'}
- {path: README.md, what: 'Overview, skill list and maturity ranking'}
- {path: THIRD-PARTY-NOTICES.md, what: 'Third-party asset sources and licenses'}
- {path: skills/yd-finguard/references/ai-sdlc.md, what: 'AI-SDLC stage contract used by yd-sdlc-orchestrator'}
- {path: skills/yd-nextjs-implementer/references/implementation-modes.md, what: 'Next.js vs Vite + React mode details'}
- {path: skills/yd-nextjs-implementer/references/data-contract-handoff.md, what: 'Planning -> data contract handoff'}
- {path: skills/yd-doksam-ui/references/catalog-workflow.md, what: 'doksam-ui catalog extension checklist'}
- {path: .claude/memory/MEMORY.md, what: 'Project memory index'}
